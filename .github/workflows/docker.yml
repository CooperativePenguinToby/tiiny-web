# Builds the Docker image for linux/amd64 and linux/arm64 and publishes it to Docker Hub
# (docker.io/cooperativepenguintoby/tiiny-web) and to this repository's GitHub Container Registry
# (ghcr.io/<owner>/<repo>, listed under the repo's Packages).
#
# Tags: `latest`, `main` and `sha-<commit>` for pushes to main; `1.2.3`, `1.2` and `latest` for a `v1.2.3` tag.
#
# The base images come from Docker Hardened Images (dhi.io), which needs a sign-in, and the same account pushes
# to Docker Hub. Set these repository secrets: DHI_USERNAME (your Docker Hub username) and DHI_TOKEN (a Docker
# Hub access token with Read & Write).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to dhi.io (base images)
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Sign in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/cooperativepenguintoby/tiiny-web
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
